<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPIX 무기점 — 스픽스 브랜딩 (키치 벽걸이 시제품)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{--blue:#0071e3;--blue-lt:#2997ff;--pink:#ff2d8a;--ink:#0b0b0c;--chrome:#e9ebef;
--sans:"Pretendard Variable","Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;--disp:"Black Han Sans","Pretendard Variable",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;font-family:var(--sans);color:#fff;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* 흐르는 띠 */
.ticker{position:fixed;left:0;right:0;top:0;height:36px;background:var(--pink);color:#000;z-index:45;overflow:hidden;display:flex;align-items:center;font-family:var(--disp);font-size:17px;white-space:nowrap}
.ticker div{display:flex;gap:40px;animation:tick 26s linear infinite;padding-left:40px}
@keyframes tick{to{transform:translateX(-50%)}}
.top{position:fixed;left:0;right:0;top:36px;height:60px;z-index:44;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#000;border-bottom:2px solid #1c1c1e}
.logo{font-family:var(--disp);font-size:26px;letter-spacing:.02em}
.logo b{color:var(--blue-lt)}
.logo small{font-family:var(--sans);font-weight:700;font-size:12px;color:#8e8e93;letter-spacing:.2em;margin-left:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px}
.pill.ghost{background:#1c1c1e;color:#fff}
.pill.blue{background:var(--blue);color:#fff;box-shadow:0 0 0 2px #000,0 0 0 4px var(--blue)}

/* 무대 */
.stage{position:fixed;left:0;right:0;top:96px;bottom:0;overflow:hidden}
.world{position:absolute;left:0;top:0;height:804px;transform-origin:0 0}
.layer{position:absolute;left:0;top:0;height:804px;will-change:transform}
/* 구멍판 벽 */
.peg{position:absolute;left:0;top:0;height:660px;background-color:#101012;
 background-image:radial-gradient(circle at 50% 50%,#000 0 5px,#2a2a2e 5.5px 6.5px,transparent 7px);background-size:44px 44px;background-position:22px 22px}
.peg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 18%,transparent 80%,rgba(0,0,0,.6))}
.shelf{position:absolute;top:660px;left:0;height:22px;background:linear-gradient(#cfd3da,#7d838c);box-shadow:0 10px 18px rgba(0,0,0,.6)}
.floor{position:absolute;top:682px;left:0;height:122px;
 background-image:conic-gradient(#fff 25%,#000 0 50%,#fff 0 75%,#000 0);background-size:60px 60px;transform-origin:top;transform:perspective(500px) rotateX(48deg);opacity:.9}

/* 네온 간판 */
.neon{position:absolute;font-family:var(--disp);color:#fff;text-shadow:0 0 6px #fff,0 0 18px var(--blue-lt),0 0 42px var(--blue),0 0 80px var(--blue);animation:flick 5s infinite}
.neon.pink{text-shadow:0 0 6px #fff,0 0 18px var(--pink),0 0 42px var(--pink),0 0 70px var(--pink)}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}
.neon.off{opacity:0;animation:none}
.neon.on{animation:boot 1.2s steps(1) forwards, flick 5s 1.2s infinite}
@keyframes boot{0%{opacity:0}15%{opacity:1}25%{opacity:.1}40%{opacity:1}50%{opacity:.2}60%,100%{opacity:1}}

.copy{position:absolute;color:#fff}
.copy .h{font-family:var(--disp);font-size:84px;line-height:1.02;letter-spacing:-.01em}
.copy .h .b{color:var(--blue-lt)}
.copy p{font-weight:600;font-size:19px;line-height:1.5;color:#c7c7cc;margin-top:18px;max-width:480px}

/* 손글씨 간판(걸린 판) */
.sign{position:absolute;background:#fff;color:#000;padding:14px 22px 16px;border-radius:6px;transform:rotate(-3deg);box-shadow:6px 6px 0 var(--blue)}
.sign::before,.sign::after{content:"";position:absolute;top:-34px;width:2px;height:34px;background:#c9ccd2}
.sign::before{left:18%}.sign::after{right:18%}
.sign b{display:block;font-family:var(--disp);font-size:34px;line-height:1}
.sign span{display:block;font-weight:800;font-size:14px;margin-top:6px;color:#333}

/* 걸린 무기 */
.w{position:absolute;display:block;transform-origin:50% 0;transition:transform .5s cubic-bezier(.3,1.6,.4,1)}
.w .hook{position:absolute;left:50%;top:-30px;width:16px;height:34px;margin-left:-8px;border:4px solid #d7dae0;border-bottom:0;border-radius:10px 10px 0 0;z-index:2}
.w .hook::before{content:"";position:absolute;left:-10px;top:-8px;width:28px;height:10px;border-radius:5px;background:linear-gradient(#f2f3f5,#8a9099)}
.w img{display:block;width:100%;filter:drop-shadow(10px 14px 0 rgba(0,0,0,.55));transition:filter .4s,transform .5s cubic-bezier(.3,1.6,.4,1)}
.w:hover,.w.on{animation:swing 1s cubic-bezier(.3,1.4,.4,1)}
.w:hover img,.w.on img{transform:scale(1.08) translateY(-6px);filter:drop-shadow(16px 22px 0 rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(41,151,255,.55))}
@keyframes swing{0%{transform:rotate(var(--r,0deg))}25%{transform:rotate(calc(var(--r,0deg) + 7deg))}50%{transform:rotate(calc(var(--r,0deg) - 5deg))}75%{transform:rotate(calc(var(--r,0deg) + 2deg))}100%{transform:rotate(var(--r,0deg))}}
.w{transform:rotate(var(--r,0deg))}
.w:focus-visible{outline:3px dashed var(--pink);outline-offset:6px}

/* 가격 별딱지 */
.burst{position:absolute;width:132px;height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#000;background:#ffe600;
 clip-path:polygon(50% 0,61% 13%,77% 6%,80% 22%,96% 24%,90% 39%,100% 50%,90% 61%,96% 76%,80% 78%,77% 94%,61% 87%,50% 100%,39% 87%,23% 94%,20% 78%,4% 76%,10% 61%,0 50%,10% 39%,4% 24%,20% 22%,23% 6%,39% 13%);transform:rotate(12deg);pointer-events:none;animation:pulse 2.4s ease-in-out infinite}
.burst.pink{background:var(--pink);color:#fff}
.burst small{font-weight:800;font-size:12px}
.burst b{font-family:var(--disp);font-size:24px;line-height:1.05;margin-top:2px}
@keyframes pulse{50%{transform:rotate(12deg) scale(1.07)}}
/* 이름표 테이프 */
.tape{position:absolute;padding:6px 12px;background:#fff;color:#000;font-weight:900;font-size:15px;transform:rotate(-4deg);pointer-events:none;box-shadow:3px 3px 0 #000}
.tape i{font-style:normal;color:var(--blue);margin-right:6px}

/* 경력 배지(동그란 딱지) */
.badge{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9dce2 40%,#9aa1ab 75%,#e6e8ec);color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 0 0 6px #fff,8px 10px 0 6px rgba(0,0,0,.5)}
.badge b{font-family:var(--disp);font-size:34px;line-height:1}
.badge span{font-weight:800;font-size:12px;line-height:1.3;margin-top:5px;padding:0 14px}

.spot{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(41,151,255,.28),transparent 65%);pointer-events:none}

/* 아래 길잡이 */
.plan{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;display:flex;gap:2px;padding:6px;border-radius:999px;background:#fff;color:#000;box-shadow:6px 6px 0 var(--blue)}
.plan button{padding:9px 15px;border-radius:999px;font-weight:800;font-size:13px;white-space:nowrap}
.plan button.on{background:#000;color:#fff}
.proto{position:fixed;left:20px;bottom:28px;z-index:39;font-weight:700;font-size:11px;color:#8e8e93;letter-spacing:.06em}

/* 서랍 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .35s;z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;background:#fff;color:#000;z-index:71;transform:translateX(105%);transition:transform .55s cubic-bezier(.2,.9,.2,1.1);overflow:auto;border-left:6px solid var(--blue)}
.open-d .scrim{opacity:1;pointer-events:auto}.open-d .drawer{transform:none}
.d-fig{height:280px;display:flex;align-items:center;justify-content:center;position:relative;background-color:#101012;background-image:radial-gradient(circle,#000 0 4px,#2a2a2e 4.5px 5.5px,transparent 6px);background-size:34px 34px}
.d-fig img{max-height:220px;max-width:300px;filter:drop-shadow(10px 12px 0 rgba(0,0,0,.6));animation:pop .6s cubic-bezier(.3,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6) rotate(-10deg)}}
.d-fig .burst{right:22px;bottom:-40px;z-index:3}
.d-close{position:absolute;top:16px;left:16px;width:40px;height:40px;border-radius:50%;background:#fff;color:#000;font-size:20px;font-weight:900}
.d-body{padding:40px 38px;display:flex;flex-direction:column;gap:22px}
.d-weapon{font-weight:900;font-size:13px;letter-spacing:.14em;color:var(--blue)}
.d-name{font-family:var(--disp);font-size:42px;line-height:1.05;margin-top:6px}
.d-one{font-weight:600;font-size:17px;line-height:1.55;color:#48484a;margin-top:10px}
.d-sec h4{font-weight:900;font-size:13px;letter-spacing:.1em;margin-bottom:10px;display:inline-block;background:#000;color:#fff;padding:4px 10px}
.d-sec ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.d-sec li{font-weight:700;font-size:16px;line-height:1.45;padding-left:22px;position:relative}
.d-sec li::before{content:"★";position:absolute;left:0;color:var(--blue);font-size:13px;top:2px}
.d-price{display:flex;align-items:baseline;gap:10px;padding:16px 0;border-top:3px solid #000;border-bottom:3px solid #000}
.d-price b{font-family:var(--disp);font-size:34px}
.d-price span{font-weight:700;font-size:14px;color:#6e6e73}
.d-cta{display:flex;gap:10px;flex-wrap:wrap}
.d-cta .pill{padding:14px 22px;font-size:15px}
.d-cta .pill.ghost{background:#f2f2f7;color:#000}
.d-note{font-weight:600;font-size:12px;color:#8e8e93}

/* 상담 */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{width:560px;max-height:88vh;overflow:auto;background:#fff;color:#000;border-radius:18px;padding:36px 40px;box-shadow:10px 10px 0 var(--pink);transform:rotate(-1.5deg) scale(.94);transition:transform .45s cubic-bezier(.3,1.5,.4,1)}
.modal.on .sheet{transform:rotate(0) scale(1)}
.sheet h3{font-family:var(--disp);font-size:36px}
.sheet .lead{color:#48484a;font-weight:600;font-size:15px;margin-top:6px}
.q{margin-top:18px}.q label{display:block;font-weight:900;font-size:14px;margin-bottom:8px}
.q input{width:100%;padding:12px 14px;border-radius:10px;border:2.5px solid #000;font:600 15px var(--sans)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 14px;border-radius:999px;border:2px solid #000;font-weight:800;font-size:13px}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.deposit{margin-top:22px;padding:14px 16px;border-radius:12px;background:#ffe600;font-weight:700;font-size:14px;line-height:1.5}
.row{display:flex;justify-content:space-between;margin-top:22px}
.row .pill.ghost{background:#f2f2f7;color:#000}

/* 목록 */
.list{position:fixed;inset:96px 0 0 0;z-index:50;background:#000;overflow:auto;padding:48px 72px 120px;opacity:0;pointer-events:none;transition:opacity .3s}
.list.on{opacity:1;pointer-events:auto}
.list h2{font-family:var(--disp);font-size:52px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:30px}
.card{background:#fff;color:#000;border-radius:16px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:6px 6px 0 var(--blue);transition:transform .3s cubic-bezier(.3,1.6,.4,1)}
.card:hover{transform:rotate(-2deg) translateY(-4px)}
.card .f{height:150px;display:flex;align-items:center;justify-content:center}.card .f img{max-height:140px;max-width:180px}
.card small{font-weight:900;font-size:12px;color:var(--blue);letter-spacing:.12em}
.card strong{font-family:var(--disp);font-size:22px}
.card span{font-weight:800;font-size:14px;color:#48484a}
</style>
</head>
<body>
<div class="ticker"><div id="tk"></div></div>
<header class="top">
  <div class="logo"><b>SPIX</b> 무기점<small>스픽스 브랜딩</small></div>
  <div style="display:flex;gap:10px"><button class="pill ghost" id="btnList">진열 목록</button><button class="pill blue" data-consult>무기 처방 상담</button></div>
</header>
<div class="stage" id="stage"><div class="world" id="world"><div class="layer" id="lMid"></div></div></div>
<nav class="plan" id="plan"></nav>
<div class="proto">키치 벽걸이 시제품 · 내부 검토용 · 가격은 가설</div>

<div id="dwrap"><div class="scrim" id="scrim"></div><aside class="drawer"><div class="d-fig" id="dFig"></div><div class="d-body" id="dBody"></div></aside></div>

<div class="modal" id="modal"><div class="sheet">
  <h3>무기 처방 상담</h3><p class="lead">1분이면 끝. 화·목 오전에 대표가 직접 연락드립니다.</p>
  <div class="q"><label>1. 상호 · 업종</label><input placeholder="예: 목포 ○○베이커리 · 빵집"></div>
  <div class="q"><label>2. 장사한 지</label><div class="chips"><button>1년 안</button><button>1~3년</button><button>3~10년</button><button>10년 넘게</button></div></div>
  <div class="q"><label>3. 지금 바꾸고 싶은 것</label><div class="chips"><button>로고·간판</button><button>홍보물</button><button>상세페이지·소개서</button><button>브랜드 전체</button><button>아직 모름</button></div></div>
  <div class="q"><label>4. 왜 지금?</label><div class="chips"><button>리뉴얼</button><button>온라인 진출</button><button>2호점</button><button>신메뉴·신제품</button><button>지원금 선정</button></div></div>
  <div class="q"><label>5. 생각하는 예산</label><div class="chips"><button>50만 원 안</button><button>50~300만</button><button>300~1,000만</button><button>1,000만 넘게</button></div></div>
  <div class="q"><label>6. 연락처</label><input placeholder="010-0000-0000"></div>
  <div class="deposit">자리 확정 예약금 10만 원 · 계약하면 대금에서 빼고, 진행 안 하면 전액 돌려드립니다.</div>
  <div class="row"><button class="pill ghost" id="mClose">닫기</button><button class="pill blue" id="mSend">신청하기</button></div>
</div></div>

<section class="list" id="list"><h2>진열 목록</h2><div class="grid" id="grid"></div></section>

 ['custom','spear',3640,90,300,-4],['custom','bow',3960,230,200,8],
 ['warmap','map',4180,140,300,-3],['book','books',4220,420,190,6],
 ['custom','axe',4520,430,110,18],['card','shuriken',4560,160,70,0],
 ['care','whetstone',5050,170,300,-3],
 ['flyer','bullets',5420,520,100,-8],
];

let h='';
h+=`<div class="peg" style="width:${W}px"></div><div class="shelf" style="width:${W}px"></div><div class="floor" style="width:${W}px"></div>`;
/* 입구 */
h+=`<div class="neon off" id="neon" style="left:110px;top:70px;font-size:120px">SPIX 무기점</div>
<div class="neon pink" style="left:770px;top:110px;font-size:40px;transform:rotate(-8deg)">OPEN</div>
<div class="copy" style="left:110px;top:260px"><div class="h">사장님 무기,<br><span class="b">골라 가세요.</span></div><p>명함 한 장부터 브랜드 전체까지. 벽에 걸린 무기를 누르면 무엇을 만들어 드리는지 나옵니다.</p></div>`;
const BADGE=[['2년','행안부 장관상 2022·2023'],['300+','언론 보도 · 방송 20여 편'],['심사석','청년마을 심사위원 2023'],['6','직접 창업한 업종']];
[[780,300,-8],[960,420,6],[800,500,4],[990,230,-4]].forEach((p,i)=>h+=`<div class="badge" style="left:${p[0]}px;top:${p[1]}px;transform:rotate(${p[2]}deg)"><b>${BADGE[i][0]}</b><span>${BADGE[i][1]}</span></div>`);
/* 구역 간판 */
const SIGN=[[1320,60,'잽 코너','가볍게, 자주 던지는 홍보물'],[2560,60,'한 방','주력 · 브랜드 패키지'],[3580,40,'멀리 · 주문 제작','긴 무기 = 맞춤 브랜드 제작'],[4170,40,'작전 탁자','지도 펼치고 싸웁니다'],[5020,40,'정비소','무뎌지지 않게, 매달'],[5700,60,'카운터','뭘 골라야 할지 모르겠다면']];
SIGN.forEach(s=>h+=`<div class="sign" style="left:${s[0]}px;top:${s[1]}px"><b>${s[2]}</b><span>${s[3]}</span></div>`);
/* 주력 조명 */
h+=`<div class="spot" style="left:2700px;top:-40px;width:700px;height:700px"></div>`;
/* 걸린 무기 */
HANG.forEach((a,i)=>{const [sv,img,x,y,w,r]=a;h+=`<button class="w" data-sv="${sv}" style="left:${x}px;top:${y}px;width:${w}px;--r:${r}deg" aria-label="${SV[sv].name}"><i class="hook"></i><img src="${IMG[img]}" alt=""></button>`});
/* 이름표·가격 딱지 (서비스마다 한 번) */
const TAG=[['card',1360,610,'명함'],['flyer',1760,400,'전단·스티커'],['banner',2080,580,'현수막·배너'],['custom',3700,600,'맞춤 제작'],['warmap',4200,370,'로드맵'],['book',4420,610,'전자책'],['care',5110,600,'브랜드 정비']];
TAG.forEach(t=>h+=`<div class="tape" style="left:${t[1]}px;top:${t[2]}px"><i>${SV[t[0]].weapon.split(' ')[0]}</i>${t[3]}</div>`);
h+=`<div class="burst" style="left:3200px;top:430px"><small>주력</small><b>300만<br>원부터</b></div>
<div class="burst pink" style="left:1590px;top:520px;width:110px;height:110px"><small>잽</small><b style="font-size:18px">인쇄<br>직배송</b></div>
<div class="burst" style="left:3980px;top:470px;width:120px;height:120px"><small>최대</small><b style="font-size:20px">2,000만</b></div>
<div class="burst pink" style="left:5320px;top:240px;width:120px;height:120px"><small>월</small><b style="font-size:20px">30만~</b></div>`;
h+=`<div class="tape" style="left:2900px;top:590px;font-size:20px;padding:8px 16px"><i>장검</i>브랜드 패키지</div>`;
/* 카운터 */
h+=`<div class="neon" style="left:5700px;top:220px;font-size:64px;line-height:1.1">무기 처방<br>받는 곳</div>
<button class="w" data-consult style="left:6150px;top:330px;width:250px;--r:0deg" aria-label="상담 신청"><i class="hook" style="display:none"></i><img src="${IMG.bell}" alt=""></button>
<div class="copy" style="left:5700px;top:420px"><p style="max-width:400px">1시간 진단으로 사장님의 무기를 찾습니다. 처방서 제목은 늘 같습니다 — “○○ 사장님의 무기”.</p></div>
<div class="burst pink" style="left:6420px;top:300px"><small>상담</small><b>무료</b></div>
<div class="tape" style="left:6170px;top:600px;font-size:18px"><i>종을 누르세요</i>상담 신청</div>`;
$('#lMid').style.width=W+'px';$('#lMid').innerHTML=h;

/* 흐르는 띠 */
const tk='★ 오늘의 무기 · 명함 · 전단 · 현수막 ★ 주력 · 브랜드 패키지 300만 원부터 ★ 맞춤 제작 최대 2,000만 ★ 브랜드 정비 월 30만~ ★ 상담은 무료 · 예약금 10만 원은 돌려드려요 ';
$('#tk').innerHTML=`<span>${tk}</span><span>${tk}</span><span>${tk}</span><span>${tk}</span>`;

/* 카메라 */
let scale=1,viewW=1440,cam=0,target=0,locked=false;
function fit(){scale=(innerHeight-96)/804;viewW=innerWidth/scale;$('#world').style.transform=`scale(${scale})`;clamp()}
function clamp(){target=Math.max(0,Math.min(W-viewW,target))}
addEventListener('resize',fit);fit();
const zc=id=>{const i=ZONES.findIndex(z=>z.id===id);const z=ZONES[i],nx=ZONES[i+1]?ZONES[i+1].x:W;return (z.x+nx)/2-viewW/2};
function go(id){target=id==='in'?0:zc(id);clamp()}
addEventListener('wheel',e=>{if(locked)return;e.preventDefault();target+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*1.1;clamp()},{passive:false});
addEventListener('keydown',e=>{if(locked)return;if(e.key==='ArrowRight')target+=420;if(e.key==='ArrowLeft')target-=420;clamp()});
let drag=null,moved=false;
$('#stage').addEventListener('pointerdown',e=>{drag={x:e.clientX,t:target};moved=false});
addEventListener('pointermove',e=>{if(drag){const d=e.clientX-drag.x;if(Math.abs(d)>5)moved=true;target=drag.t-d/scale*1.4;clamp()}});
addEventListener('pointerup',()=>setTimeout(()=>drag=null,0));
const plan=$('#plan');ZONES.forEach(z=>{const b=document.createElement('button');b.textContent=z.nav;b.dataset.z=z.id;b.onclick=()=>go(z.id);plan.appendChild(b)});
const nb=[...plan.children];
(function tick(){cam+=(target-cam)*.085;$('#lMid').style.transform=`translate3d(${-cam}px,0,0)`;
 const m=cam+viewW/2;let cur='in';ZONES.forEach(z=>{if(m>=z.x)cur=z.id});nb.forEach(b=>b.classList.toggle('on',b.dataset.z===cur));requestAnimationFrame(tick)})();

/* 서랍 */
const order=['card','flyer','banner','package','custom','warmap','book','care'];
function openSv(id,el){
 const s=SV[id];document.querySelectorAll('.w').forEach(b=>b.classList.toggle('on',b===el));
 const pb=s.price.length<9?s.price:s.price.replace(' + ','<br>+ ');
 $('#dFig').innerHTML=`<button class="d-close" id="dClose">×</button><img src="${IMG[s.img]}" alt=""><div class="burst ${id==='package'?'':'pink'}"><small>${s.weapon.split(' ')[0]}</small><b style="font-size:${s.price.length>8?15:22}px">${pb}</b></div>`;
 const nx=order[(order.indexOf(id)+1)%order.length];
 $('#dBody').innerHTML=`<div><div class="d-weapon">${s.weapon}</div><div class="d-name">${s.name}</div><p class="d-one">${s.one}</p></div>
 <div class="d-sec"><h4>받는 것</h4><ul>${s.get.map(g=>`<li>${g}</li>`).join('')}</ul></div>
 <div class="d-sec"><h4>이런 사장님께</h4><ul>${s.who.map(g=>`<li>${g}</li>`).join('')}</ul></div>
 <div class="d-price"><b>${s.price}</b><span>${s.unit}</span></div>
 <div class="d-cta"><button class="pill blue" data-consult>이 무기로 상담</button><button class="pill ghost" id="dNext">다음 무기 · ${SV[nx].weapon.split(' ')[0]}</button></div>
 <p class="d-note">견적서 · 세금계산서는 회사 이름 '스픽스'로 발행합니다.</p>`;
 $('#dClose').onclick=closeD;$('#dNext').onclick=()=>{const el2=document.querySelector(`.w[data-sv=${nx}]`);openSv(nx,el2);target=parseFloat(el2.style.left)+parseFloat(el2.style.width)/2-(viewW-480/scale)/2;clamp()};
 if(el){target=parseFloat(el.style.left)+parseFloat(el.style.width)/2-(viewW-480/scale)/2;clamp()}
 $('#dwrap').classList.add('open-d');locked=true;
}
function closeD(){$('#dwrap').classList.remove('open-d');locked=false;document.querySelectorAll('.w').forEach(b=>b.classList.remove('on'))}
$('#scrim').onclick=closeD;
document.addEventListener('click',e=>{
 if(moved)return;
 if(e.target.closest('[data-consult]')){openModal();return}
 const w=e.target.closest('.w');if(w&&w.dataset.sv)openSv(w.dataset.sv,w);
});
function openModal(){closeD();$('#modal').classList.add('on');locked=true}
function closeModal(){$('#modal').classList.remove('on');locked=false}
$('#mClose').onclick=closeModal;$('#mSend').onclick=()=>{$('#mSend').textContent='접수 완료 (시제품)';setTimeout(()=>{closeModal();$('#mSend').textContent='신청하기'},1200)};
document.querySelectorAll('.chips').forEach(c=>c.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...c.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')}));
addEventListener('keydown',e=>{if(e.key==='Escape'){closeD();closeModal();$('#list').classList.remove('on')}});
/* 목록 */
$('#grid').innerHTML=order.map(id=>`<button class="card" data-l="${id}"><div class="f"><img src="${IMG[SV[id].img]}" alt=""></div><small>${SV[id].weapon}</small><strong>${SV[id].name}</strong><span>${SV[id].price}</span></button>`).join('');
$('#btnList').onclick=()=>{const l=$('#list');l.classList.toggle('on');$('#btnList').textContent=l.classList.contains('on')?'벽으로':'진열 목록'};
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;$('#list').classList.remove('on');$('#btnList').textContent='진열 목록';const el=document.querySelector(`.w[data-sv=${c.dataset.l}]`);setTimeout(()=>openSv(c.dataset.l,el),300)});
/* 입장: 네온이 켜진다 */
setTimeout(()=>{$('#neon').classList.remove('off');$('#neon').classList.add('on')},600);
</script>
</body>
</html>
