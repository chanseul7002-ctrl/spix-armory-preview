<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPIX 무기점 — 스픽스 브랜딩 (스트리트 화보 시제품)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

<style>
:root{--blue:#0071e3;--blue-lt:#2997ff;--sans:"Pretendard Variable","Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;font-family:var(--sans);color:#fff;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.lab{font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.ticker{position:fixed;left:0;right:0;top:0;height:30px;background:var(--blue);color:#fff;z-index:45;overflow:hidden;display:flex;align-items:center;white-space:nowrap;font-weight:700;font-size:12px;letter-spacing:.18em}
.ticker div{display:flex;gap:48px;animation:tick 40s linear infinite;padding-left:48px}
@keyframes tick{to{transform:translateX(-50%)}}
.top{position:fixed;left:0;right:0;top:30px;height:60px;z-index:44;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid #1c1c1e}
.logo{font-weight:900;font-size:20px;letter-spacing:-.01em}
.logo b{font-weight:900}
.logo small{font-weight:600;font-size:11px;color:#8e8e93;letter-spacing:.22em;margin-left:12px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:700;font-size:13px}
.pill.ghost{border:1px solid #3a3a3c;color:#fff}
.pill.blue{background:var(--blue);color:#fff}
.stage{position:fixed;left:0;right:0;top:90px;bottom:0;overflow:hidden}
.world{position:absolute;left:0;top:0;height:810px;transform-origin:0 0}
.layer{position:absolute;left:0;top:0;height:810px;will-change:transform}
.peg{position:absolute;left:0;top:0;height:690px;background-color:#0c0c0d;background-image:radial-gradient(circle,#000 0 3.5px,#1f1f22 4px 4.8px,transparent 5.2px);background-size:36px 36px;background-position:18px 18px}
.peg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,transparent 40%,rgba(0,0,0,.55))}
.shelf{position:absolute;top:690px;left:0;height:2px;background:#3a3a3c}
.floor{position:absolute;top:692px;left:0;height:118px;background:#000}
.neon{position:absolute;font-weight:900;letter-spacing:-.03em;color:#fff;text-shadow:0 0 4px #fff,0 0 14px var(--blue-lt),0 0 34px var(--blue);animation:flick 6s infinite}
@keyframes flick{0%,30%,32%,100%{opacity:1}31%{opacity:.4}}
.neon.off{opacity:0;animation:none}
.neon.on{animation:boot 1.1s steps(1) forwards,flick 6s 1.1s infinite}
@keyframes boot{0%{opacity:0}15%{opacity:1}25%{opacity:.15}40%{opacity:1}52%{opacity:.25}60%,100%{opacity:1}}
.copy{position:absolute}
.copy .h{font-weight:800;font-size:72px;line-height:1.05;letter-spacing:-.04em}
.copy .h .b{color:var(--blue-lt)}
.copy p{font-weight:500;font-size:18px;line-height:1.55;color:#a1a1a6;margin-top:18px;max-width:440px}
.stats{position:absolute;display:grid;grid-template-columns:repeat(2,190px);gap:34px 24px}
.stats div{border-top:1px solid #3a3a3c;padding-top:12px}
.stats b{display:block;font-weight:800;font-size:44px;letter-spacing:-.04em;line-height:1}
.stats span{display:block;font-weight:500;font-size:13px;color:#8e8e93;margin-top:8px;line-height:1.4}
.sign{position:absolute}
.sign .lab{color:var(--blue-lt)}
.sign b{display:block;font-weight:800;font-size:30px;letter-spacing:-.03em;margin-top:8px}
.sign span{display:block;font-weight:500;font-size:14px;color:#8e8e93;margin-top:4px}
.w{position:absolute;display:block;transform-origin:50% 0;transform:rotate(var(--r,0deg))}
.w .hook{position:absolute;left:50%;top:-26px;width:12px;height:30px;margin-left:-6px;border:3px solid #9a9ea6;border-bottom:0;border-radius:8px 8px 0 0;z-index:2}
.w .hook::before{content:"";position:absolute;left:-8px;top:-6px;width:22px;height:7px;border-radius:4px;background:#5a5e66}
.w img{display:block;width:100%;filter:drop-shadow(0 22px 22px rgba(0,0,0,.85)) brightness(.92);transition:filter .45s,transform .6s cubic-bezier(.2,.9,.2,1)}
.w:hover,.w.on{animation:swing 1.1s cubic-bezier(.3,1.3,.4,1)}
.w:hover img,.w.on img{transform:translateY(-8px) scale(1.04);filter:drop-shadow(0 30px 28px rgba(0,0,0,.9)) brightness(1.12)}
@keyframes swing{0%{transform:rotate(var(--r,0deg))}25%{transform:rotate(calc(var(--r,0deg) + 5deg))}55%{transform:rotate(calc(var(--r,0deg) - 3deg))}80%{transform:rotate(calc(var(--r,0deg) + 1deg))}100%{transform:rotate(var(--r,0deg))}}
.w:focus-visible{outline:1px solid var(--blue-lt);outline-offset:8px}
/* 옷 가격표 */
.ht{position:absolute;width:118px;padding:16px 12px 12px;background:#f5f5f7;color:#000;border-radius:3px;pointer-events:none;transform:rotate(var(--t,4deg));transform-origin:50% -40px}
.ht::before{content:"";position:absolute;top:7px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:#0c0c0d}
.ht::after{content:"";position:absolute;top:-40px;left:50%;width:1px;height:48px;background:#8e8e93}
.ht .lab{font-size:9px;letter-spacing:.18em;color:#6e6e73}
.ht b{display:block;font-weight:800;font-size:15px;letter-spacing:-.02em;margin-top:5px;line-height:1.2}
.ht span{display:block;font-weight:800;font-size:12px;color:var(--blue);margin-top:6px}
.ht.main{width:150px}.ht.main b{font-size:19px}.ht.main span{font-size:15px}
.spot{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07),transparent 62%);pointer-events:none}
.plan{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;display:flex;gap:2px;padding:5px;border-radius:999px;background:rgba(28,28,30,.85);backdrop-filter:blur(12px);border:1px solid #2c2c2e}
.plan button{padding:9px 15px;border-radius:999px;font-weight:700;font-size:12px;color:#a1a1a6;white-space:nowrap}
.plan button.on{background:#fff;color:#000}
.proto{position:fixed;left:24px;bottom:32px;z-index:39;font-weight:600;font-size:10px;color:#636366;letter-spacing:.12em}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .35s;z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;background:#fff;color:#000;z-index:71;transform:translateX(100%);transition:transform .55s cubic-bezier(.2,.8,.2,1);overflow:auto}
.open-d .scrim{opacity:1;pointer-events:auto}.open-d .drawer{transform:none}
.d-fig{height:300px;display:flex;align-items:center;justify-content:center;position:relative;background:#0c0c0d}
.d-fig img{max-height:230px;max-width:340px;filter:drop-shadow(0 22px 22px rgba(0,0,0,.9));animation:pop .7s cubic-bezier(.2,.9,.2,1)}
@keyframes pop{from{transform:translateY(20px);opacity:0}}
.d-code{position:absolute;left:24px;bottom:18px;color:#8e8e93}
.d-close{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;background:#1c1c1e;color:#fff;font-size:18px}
.d-body{padding:36px 40px;display:flex;flex-direction:column;gap:22px}
.d-weapon{color:var(--blue)}
.d-name{font-weight:800;font-size:36px;letter-spacing:-.035em;line-height:1.1;margin-top:8px}
.d-one{font-weight:500;font-size:16px;line-height:1.6;color:#6e6e73;margin-top:10px}
.d-sec h4{color:#8e8e93;margin-bottom:10px}
.d-sec ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.d-sec li{font-weight:600;font-size:15px;line-height:1.45;padding-left:16px;position:relative}
.d-sec li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:1.5px;background:#000}
.d-price{display:flex;align-items:baseline;gap:10px;padding:16px 0;border-top:1px solid #000;border-bottom:1px solid #d2d2d7}
.d-price b{font-weight:800;font-size:28px;letter-spacing:-.03em}
.d-price span{font-weight:600;font-size:13px;color:#8e8e93}
.d-cta{display:flex;gap:10px;flex-wrap:wrap}
.d-cta .pill{padding:14px 22px;font-size:14px}
.d-cta .pill.ghost{border-color:#d2d2d7;color:#000}
.d-note{font-weight:500;font-size:12px;color:#8e8e93}
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{width:560px;max-height:88vh;overflow:auto;background:#fff;color:#000;border-radius:16px;padding:36px 40px;transform:translateY(20px);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.modal.on .sheet{transform:none}
.sheet h3{font-weight:800;font-size:30px;letter-spacing:-.03em}
.sheet .lead{color:#6e6e73;font-weight:500;font-size:15px;margin-top:6px}
.q{margin-top:18px}.q label{display:block;font-weight:700;font-size:13px;margin-bottom:8px}
.q input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #d2d2d7;font:500 15px var(--sans)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 14px;border-radius:999px;border:1px solid #d2d2d7;font-weight:600;font-size:13px}
.chips button.on{background:#000;border-color:#000;color:#fff}
.deposit{margin-top:22px;padding:14px 16px;border-radius:10px;background:#f5f5f7;font-weight:600;font-size:13px;line-height:1.55;color:#48484a}
.row{display:flex;justify-content:space-between;margin-top:22px}
.row .pill.ghost{border-color:#d2d2d7;color:#000}
.list{position:fixed;inset:90px 0 0 0;z-index:50;background:#000;overflow:auto;padding:48px 72px 120px;opacity:0;pointer-events:none;transition:opacity .3s}
.list.on{opacity:1;pointer-events:auto}
.list h2{font-weight:800;font-size:44px;letter-spacing:-.04em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:30px;background:#2c2c2e;border:1px solid #2c2c2e}
.card{background:#0c0c0d;padding:22px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:background .3s}
.card:hover{background:#161618}
.card .f{height:160px;display:flex;align-items:center;justify-content:center}.card .f img{max-height:140px;max-width:190px}
.card small{color:var(--blue-lt)}
.card strong{font-weight:800;font-size:19px;letter-spacing:-.02em}
.card span{font-weight:600;font-size:13px;color:#8e8e93}
</style>
</head>
<body>
<div class="ticker"><div id="tk"></div></div>
<header class="top">
  <div class="logo"><b>SPIX</b> ARMORY<small>스픽스 브랜딩 · 무기점</small></div>
  <div style="display:flex;gap:10px"><button class="pill ghost" id="btnList">진열 목록</button><button class="pill blue" data-consult>무기 처방 상담</button></div>
</header>
<div class="stage" id="stage"><div class="world" id="world"><div class="layer" id="lMid"></div></div></div>
<nav class="plan" id="plan"></nav>
<div class="proto">스트리트 화보 시제품 · 내부 검토용 · 가격은 가설</div>

<div id="dwrap"><div class="scrim" id="scrim"></div><aside class="drawer"><div class="d-fig" id="dFig"></div><div class="d-body" id="dBody"></div></aside></div>

<div class="modal" id="modal"><div class="sheet">
  <h3>무기 처방 상담</h3><p class="lead">1분이면 끝. 화·목 오전에 대표가 직접 연락드립니다.</p>
  <div class="q"><label>1. 상호 · 업종</label><input placeholder="예: 목포 ○○베이커리 · 빵집"></div>
  <div class="q"><label>2. 장사한 지</label><div class="chips"><button>1년 안</button><button>1~3년</button><button>3~10년</button><button>10년 넘게</button></div></div>
  <div class="q"><label>3. 지금 바꾸고 싶은 것</label><div class="chips"><button>로고·간판</button><button>홍보물</button><button>상세페이지·소개서</button><button>브랜드 전체</button><button>아직 모름</button></div></div>
  <div class="q"><label>4. 왜 지금?</label><div class="chips"><button>리뉴얼</button><button>온라인 진출</button><button>2호점</button><button>신메뉴·신제품</button><button>지원금 선정</button></div></div>
  <div class="q"><label>5. 생각하는 예산</label><div class="chips"><button>50만 원 안</button><button>50~300만</button><button>300~1,000만</button><button>1,000만 넘게</button></div></div>
  <div class="q"><label>6. 연락처</label><input placeholder="010-0000-0000"></div>
  <div class="deposit">자리 확정 예약금 10만 원 · 계약하면 대금에서 빼고, 진행 안 하면 전액 돌려드립니다.</div>
  <div class="row"><button class="pill ghost" id="mClose">닫기</button><button class="pill blue" id="mSend">신청하기</button></div>
</div></div>

<section class="list" id="list"><h2>진열 목록</h2><div class="grid" id="grid"></div></section>

 package:{weapon:'장검 · 주력',name:'브랜드 패키지',one:'한 방에 끝내는 주력 무기. 대표가 직접 진단하고, 처방대로 만듭니다.',get:['대표 진단 인터뷰 1회','브랜드 처방서 1장 — 차별점 한 줄 · 타깃 · 주력 채널 · 6개월 할 일 3개','한 줄 소개 + 로고 정리','대표 홍보물 1종(상세페이지 · 소개서 · 간판 문구 중)','지원금 고객은 견적서 · 집행 서류까지'],who:['리뉴얼 · 온라인 진출 · 2호점처럼 지금 바꿀 계기가 생긴 가게','브랜드 · 홍보 비목이 있는 소기업'],price:'300만 원부터',unit:'2~3주',img:'sword'},
 custom:{weapon:'창 · 도끼 · 활',name:'맞춤 브랜드 제작',one:'멀리 닿는 긴 무기, 원하는 무기는 주문 제작. 처방서대로 브랜드 · 영상 · 웹 · 제품 패키지를 넓힙니다.',get:['브랜드(CI·BI) 디자인','홍보 영상 · 웹사이트','제품 패키지 · 홍보물 묶음','제작 전 과정 대표 디렉팅'],who:['패키지를 마친 고객','신제품을 내는 로컬 소기업 · 기관'],price:'최대 2,000만 원',unit:'처방 뒤 견적',img:'spear'},
 warmap:{weapon:'전쟁 지도',name:'창업 · 성장 로드맵',one:'싸우기 전에 펼치는 지도. 노릴 지원사업과 순서를 한 장에.',get:['지금 위치 진단','노릴 지원사업 목록과 순서','12월 통합공고 ~ 5월 접수 달력'],who:['창업 준비 · 초기 창업자','지원사업을 처음 노리는 소기업'],price:'제작과 묶음 또는 별도',unit:'견적',img:'map'},
 book:{weapon:'병법서',name:'지원사업 전자책 + 양식',one:'혼자 싸울 사람에게 주는 교본. 로컬대학과 같은 원본입니다.',get:['사업계획서 쓰는 법 전자책','바로 채우는 양식 원본'],who:['직접 써 보고 싶은 창업자'],price:'준비 중',unit:'2026년 12월',img:'books'},
 care:{weapon:'숫돌',name:'브랜드 정비 (월 구독)',one:'무기는 쓰면 무뎌집니다. 매달 한 번 갈아 드립니다.',get:['브랜드 디렉터 월 1회 점검','핵심 콘텐츠 4~8건 제작','분기 1회 브랜드 자산 정리','월 단위 해지'],who:['스픽스에서 패키지 · 제작을 받은 고객만'],price:'월 30만 원부터',unit:'라이트 30~50만 · 스탠다드 60~90만',img:'whetstone'},
};

/* 벽 구역 */
const ZONES=[{id:'in',x:0,nav:'입구'},{id:'jab',x:1300,nav:'홍보물'},{id:'main',x:2700,nav:'브랜드 패키지'},{id:'reach',x:3750,nav:'맞춤 제작 · 지도'},{id:'care',x:5150,nav:'정비'},{id:'counter',x:5900,nav:'상담'}];
const W=7150;
/* 벽에 거는 것: [서비스, 그림, x, y, 폭, 기울기] — 클수록 비싼 무기 */
const HANG=[
 ['card','shuriken',1340,200,170,-6],['card','shuriken',1540,150,92,12],['card','shuriken',1500,420,120,20],['card','shuriken',1360,500,84,-10],['card','shuriken',1650,330,70,4],
 ['flyer','bullets',1780,190,260,0],['flyer','bullets',1820,420,180,-3],['flyer','bullets',2010,560,120,4],
 ['banner','arrows',2160,150,240,-4],['banner','arrows',2300,440,150,8],
 ['custom','nunchaku',2480,170,170,6],['card','shuriken',2560,470,74,-14],
 ['package','sword',2830,120,560,-2],
 ['custom','axe',3560,270,200,-8],['flyer','bullets',3580,500,120,2],
 ['custom','spear',3800,110,520,-3],['custom','bow',3900,390,360,4],
 ['warmap','map',4430,130,330,-2],['book','books',4480,430,250,3],
 ['custom','axe',4830,400,140,12],['custom','nunchaku',4850,140,130,-6],['card','shuriken',5000,300,70,0],
 ['care','whetstone',5260,180,340,-1],
];
let h='';
h+=`<div class="peg" style="width:${W}px"></div><div class="shelf" style="width:${W}px"></div><div class="floor" style="width:${W}px"></div>`;
h+=`<div class="lab" style="position:absolute;left:110px;top:70px;color:#8e8e93">SPIX BRANDING — EST. 남도 · 기획 대장간</div>
<div class="neon off" id="neon" style="left:104px;top:100px;font-size:118px">SPIX ARMORY</div>
<div class="copy" style="left:110px;top:290px"><div class="h">사장님 무기,<br><span class="b">골라 가세요.</span></div><p>명함 한 장부터 브랜드 전체까지. 벽에 걸린 무기를 누르면 무엇을 만들어 드리는지 나옵니다.</p></div>
<div class="stats" style="left:820px;top:300px">
 <div><b>2년</b><span>행안부 장관상<br>2022 · 2023 연속</span></div>
 <div><b>300+</b><span>언론 보도<br>방송 출연 20여 편</span></div>
 <div><b>심사석</b><span>청년마을 심사위원<br>2023</span></div>
 <div><b>6</b><span>직접 창업해 본 업종</span></div></div>`;
const SIGN=[[1340,64,'01 — JAB','잽 코너','가볍게, 자주 던지는 홍보물'],[2730,64,'02 — MAIN','한 방','주력 · 브랜드 패키지'],[3570,64,'03 — REACH','멀리, 주문 제작','긴 무기 = 맞춤 브랜드 제작'],[4440,64,'04 — STRATEGY','작전 탁자','지도 펼치고 싸웁니다'],[5260,64,'05 — CARE','정비소','무뎌지지 않게, 매달'],[5960,64,'06 — COUNTER','카운터','뭘 골라야 할지 모르겠다면']];
SIGN.forEach(s=>h+=`<div class="sign" style="left:${s[0]}px;top:${s[1]}px"><div class="lab">${s[2]}</div><b>${s[3]}</b><span>${s[4]}</span></div>`);
h+=`<div class="spot" style="left:2700px;top:-120px;width:820px;height:820px"></div>`;
HANG.forEach(a=>{const [sv,img,x,y,w,r]=a;h+=`<button class="w" data-sv="${sv}" style="left:${x}px;top:${y}px;width:${w}px;--r:${r}deg" aria-label="${SV[sv].name}"><i class="hook" style="left:${HK[img][0]*100}%"></i><img src="${IMG[img]}" alt=""></button>`});
/* 옷 가격표: [서비스, x, y, 기울기, 코드] */
const HT=[['card',1580,560,5,'SPX-01'],['flyer',2080,380,-4,'SPX-02'],['banner',2420,330,6,'SPX-03'],['package',3360,430,-5,'SPX-10'],['custom',4250,300,4,'SPX-20'],['warmap',4760,330,-6,'SPX-30'],['book',4740,560,5,'SPX-31'],['care',5620,450,-4,'SPX-40']];
HT.forEach(t=>{const s=SV[t[0]];h+=`<div class="ht ${t[0]==='package'?'main':''}" style="left:${t[1]}px;top:${t[2]}px;--t:${t[3]}deg"><div class="lab">${t[4]} · ${s.weapon.split(' ')[0]}</div><b>${s.name.replace(' (월 구독)','')}</b><span>${s.price}</span></div>`});
h+=`<div class="neon" style="left:5960px;top:210px;font-size:58px;line-height:1.1">무기 처방<br>받는 곳</div>
<button class="w" data-consult style="left:6420px;top:300px;width:280px;--r:0deg" aria-label="상담 신청"><img src="${IMG.bell}" alt=""></button>
<div class="copy" style="left:5960px;top:400px"><p style="max-width:380px">1시간 진단으로 사장님의 무기를 찾습니다. 처방서 제목은 늘 같습니다 — “○○ 사장님의 무기”.</p><p class="lab" style="color:#2997ff;margin-top:26px">종을 누르면 상담 신청 · 상담 무료</p></div>`;
$('#lMid').style.width=W+'px';$('#lMid').innerHTML=h;

/* 흐르는 띠 */
const tk='SPIX ARMORY — 명함 · 전단 · 현수막 — 브랜드 패키지 300만 원부터 — 맞춤 제작 최대 2,000만 원 — 브랜드 정비 월 30만 원부터 — 상담 무료 · 예약금 10만 원 환불 — ';
$('#tk').innerHTML=`<span>${tk}</span><span>${tk}</span><span>${tk}</span><span>${tk}</span>`;

/* 카메라 */
let scale=1,viewW=1440,cam=0,target=0,locked=false;
function fit(){scale=(innerHeight-90)/810;viewW=innerWidth/scale;$('#world').style.transform=`scale(${scale})`;clamp()}
function clamp(){target=Math.max(0,Math.min(W-viewW,target))}
addEventListener('resize',fit);fit();
const zc=id=>{const i=ZONES.findIndex(z=>z.id===id);const z=ZONES[i],nx=ZONES[i+1]?ZONES[i+1].x:W;return (z.x+nx)/2-viewW/2};
function go(id){target=id==='in'?0:zc(id);clamp()}
addEventListener('wheel',e=>{if(locked)return;e.preventDefault();target+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*1.1;clamp()},{passive:false});
addEventListener('keydown',e=>{if(locked)return;if(e.key==='ArrowRight')target+=420;if(e.key==='ArrowLeft')target-=420;clamp()});
let drag=null,moved=false;
$('#stage').addEventListener('pointerdown',e=>{drag={x:e.clientX,t:target};moved=false});
addEventListener('pointermove',e=>{if(drag){const d=e.clientX-drag.x;if(Math.abs(d)>5)moved=true;target=drag.t-d/scale*1.4;clamp()}});
addEventListener('pointerup',()=>setTimeout(()=>drag=null,0));
const plan=$('#plan');ZONES.forEach(z=>{const b=document.createElement('button');b.textContent=z.nav;b.dataset.z=z.id;b.onclick=()=>go(z.id);plan.appendChild(b)});
const nb=[...plan.children];
(function tick(){cam+=(target-cam)*.085;$('#lMid').style.transform=`translate3d(${-cam}px,0,0)`;
 const m=cam+viewW/2;let cur='in';ZONES.forEach(z=>{if(m>=z.x)cur=z.id});nb.forEach(b=>b.classList.toggle('on',b.dataset.z===cur));requestAnimationFrame(tick)})();

/* 서랍 */
const order=['card','flyer','banner','package','custom','warmap','book','care'];
function openSv(id,el){
 const s=SV[id];document.querySelectorAll('.w').forEach(b=>b.classList.toggle('on',b===el));
 const pb=s.price.length<9?s.price:s.price.replace(' + ','<br>+ ');
 $('#dFig').innerHTML=`<button class="d-close" id="dClose">×</button><img src="${IMG[s.img]}" alt=""><div class="d-code lab">SPX · ${s.weapon}</div>`;
 const nx=order[(order.indexOf(id)+1)%order.length];
 $('#dBody').innerHTML=`<div><div class="d-weapon lab">${s.weapon}</div><div class="d-name">${s.name}</div><p class="d-one">${s.one}</p></div>
 <div class="d-sec"><h4 class="lab">받는 것</h4><ul>${s.get.map(g=>`<li>${g}</li>`).join('')}</ul></div>
 <div class="d-sec"><h4 class="lab">이런 사장님께</h4><ul>${s.who.map(g=>`<li>${g}</li>`).join('')}</ul></div>
 <div class="d-price"><b>${s.price}</b><span>${s.unit}</span></div>
 <div class="d-cta"><button class="pill blue" data-consult>이 무기로 상담</button><button class="pill ghost" id="dNext">다음 무기 · ${SV[nx].weapon.split(' ')[0]}</button></div>
 <p class="d-note">견적서 · 세금계산서는 회사 이름 '스픽스'로 발행합니다.</p>`;
 $('#dClose').onclick=closeD;$('#dNext').onclick=()=>{const el2=document.querySelector(`.w[data-sv=${nx}]`);openSv(nx,el2);target=parseFloat(el2.style.left)+parseFloat(el2.style.width)/2-(viewW-480/scale)/2;clamp()};
 if(el){target=parseFloat(el.style.left)+parseFloat(el.style.width)/2-(viewW-480/scale)/2;clamp()}
 $('#dwrap').classList.add('open-d');locked=true;
}
function closeD(){$('#dwrap').classList.remove('open-d');locked=false;document.querySelectorAll('.w').forEach(b=>b.classList.remove('on'))}
$('#scrim').onclick=closeD;
document.addEventListener('click',e=>{
 if(moved)return;
 if(e.target.closest('[data-consult]')){openModal();return}
 const w=e.target.closest('.w');if(w&&w.dataset.sv)openSv(w.dataset.sv,w);
});
function openModal(){closeD();$('#modal').classList.add('on');locked=true}
function closeModal(){$('#modal').classList.remove('on');locked=false}
$('#mClose').onclick=closeModal;$('#mSend').onclick=()=>{$('#mSend').textContent='접수 완료 (시제품)';setTimeout(()=>{closeModal();$('#mSend').textContent='신청하기'},1200)};
document.querySelectorAll('.chips').forEach(c=>c.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...c.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')}));
addEventListener('keydown',e=>{if(e.key==='Escape'){closeD();closeModal();$('#list').classList.remove('on')}});
/* 목록 */
$('#grid').innerHTML=order.map(id=>`<button class="card" data-l="${id}"><div class="f"><img src="${IMG[SV[id].img]}" alt=""></div><small class="lab">${SV[id].weapon}</small><strong>${SV[id].name}</strong><span>${SV[id].price}</span></button>`).join('');
$('#btnList').onclick=()=>{const l=$('#list');l.classList.toggle('on');$('#btnList').textContent=l.classList.contains('on')?'벽으로':'진열 목록'};
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;$('#list').classList.remove('on');$('#btnList').textContent='진열 목록';const el=document.querySelector(`.w[data-sv=${c.dataset.l}]`);setTimeout(()=>openSv(c.dataset.l,el),300)});
/* 입장: 네온이 켜진다 */
setTimeout(()=>{$('#neon').classList.remove('off');$('#neon').classList.add('on')},600);
</script>
</body>
</html>
