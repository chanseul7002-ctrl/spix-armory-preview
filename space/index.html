<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스픽스 브랜딩 — 기획 대장간 (공간형 시제품)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --white:#fff;--mist:#f5f5f7;--black:#000;--ink:#1d1d1f;--ink-2:#6e6e73;--ink-3:#86868b;--night-2:#a1a1a6;--line:#d2d2d7;
  --blue:#0071e3;--blue-lt:#2997ff;
  --sans:"Pretendard Variable","Pretendard","Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#fff;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* 머리줄 */
.top{position:fixed;inset:0 0 auto 0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand img{height:30px;filter:brightness(0)}
.brand small{font-weight:600;font-size:13px;color:var(--ink-3);letter-spacing:.12em;margin-left:4px}
.top-r{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px}
.pill.ghost{background:var(--mist)}
.pill.blue{background:var(--blue);color:#fff}
.top{transition:background .5s,color .5s}.top.dk{background:rgba(0,0,0,.72);color:#fff;border-color:#1d1d1f}.top.dk .brand img{filter:none}.top.dk .pill.ghost{background:#1d1d1f;color:#fff}

/* 무대 */
.stage{position:fixed;inset:0;overflow:hidden}
.world{position:absolute;left:0;top:0;height:900px;transform-origin:0 0;will-change:transform}
.layer{position:absolute;left:0;top:0;height:900px;will-change:transform}
.room{position:absolute;top:0;height:900px}
.wall{position:absolute;left:0;right:0;top:0;height:700px}
.floor{position:absolute;left:0;right:0;top:700px;bottom:0;background:var(--mist)}
.floor::before,.floor::after{content:"";position:absolute;left:0;right:0;height:1px;background:var(--line)}
.floor::before{top:48px}.floor::after{top:128px}
.room.dark .floor{background:#111}
.room.dark .floor::before,.room.dark .floor::after{background:#2a2a2c}
.base{position:absolute;left:0;right:0;top:688px;height:12px;background:var(--ink)}
.room.dark .base{background:#2a2a2c}

.zone-text{position:absolute;top:118px;width:620px}
.eyebrow{font-weight:600;font-size:15px;letter-spacing:.15em;color:var(--blue);text-transform:uppercase}
.zt-h{font-weight:800;font-size:56px;line-height:1.1;letter-spacing:-.03em;margin-top:14px;text-wrap:balance}
.zt-b{font-weight:500;font-size:19px;line-height:1.5;color:var(--ink-2);margin-top:16px;max-width:520px}
.dark{color:#fff}
.dark .eyebrow{color:var(--blue-lt)}
.dark .zt-b{color:var(--night-2)}

/* 입구 */
.hero-h{font-weight:800;font-size:96px;line-height:1.04;letter-spacing:-.04em}
.hero-h .blue{color:var(--blue)}
.hint{position:absolute;display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;color:var(--ink-2)}
.hint i{display:block;width:56px;height:2px;background:var(--ink);position:relative;overflow:hidden}
.hint i::after{content:"";position:absolute;inset:0;background:var(--blue);transform:translateX(-100%);animation:run 1.6s ease-in-out infinite}
@keyframes run{to{transform:translateX(100%)}}

.plaque{position:absolute;width:250px;padding:22px 24px;background:#fff;border:1.5px solid var(--ink);border-radius:4px}
.plaque b{display:block;font-weight:800;font-size:44px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.plaque span{display:block;margin-top:10px;font-weight:600;font-size:15px;line-height:1.4;color:var(--ink-2)}
.plaque em{font-style:normal;color:var(--blue)}
.nail{position:absolute;top:-30px;left:50%;width:1px;height:30px;background:var(--ink)}
.nail::before{content:"";position:absolute;top:-4px;left:-4px;width:9px;height:9px;border-radius:50%;background:var(--ink)}

/* 진열 받침 */
.plinth{position:absolute;background:#fff;border:1.5px solid var(--ink);border-bottom:0}
.plinth::before{content:"";position:absolute;left:-10px;right:-10px;top:-12px;height:12px;background:var(--ink)}
.room.dark .plinth{background:#161617;border-color:#3a3a3c}
.room.dark .plinth::before{background:#fff}
.shadow{position:absolute;height:14px;border-radius:50%;background:#e3e3e8;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
.room.dark .shadow{background:#1f1f22}

/* 물건 */
.item{position:absolute;display:block;text-align:left;padding:0}
.item .obj{position:absolute;left:0;top:0}
.item .obj{display:block;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.item:hover .obj,.item.on .obj{transform:translateY(-14px)}
.item:hover .shadow,.item.on .shadow{transform:scaleX(.82);opacity:.7}
.item:focus-visible{outline:2px solid var(--blue);outline-offset:8px;border-radius:8px}
.tag{position:absolute;padding:12px 16px 14px;background:#fff;border:1.5px solid var(--ink);border-radius:4px;transform-origin:50% -26px;transition:transform .6s cubic-bezier(.3,1.6,.4,1);min-width:150px}
.tag::before{content:"";position:absolute;top:-26px;left:50%;width:1.5px;height:26px;background:var(--ink)}
.tag.plate{transform-origin:50% 0}.tag.plate::before{display:none}.item:hover .tag.plate,.item.on .tag.plate{transform:translateY(-3px)}
.tag::after{content:"";position:absolute;top:8px;left:50%;margin-left:-4px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink);display:none}
.tag small{display:block;font-weight:600;font-size:12px;letter-spacing:.14em;color:var(--ink-3)}
.tag strong{display:block;font-weight:800;font-size:22px;letter-spacing:-.02em;margin-top:4px}
.tag span{display:block;font-weight:700;font-size:14px;color:var(--blue);margin-top:6px;font-variant-numeric:tabular-nums}
.item:hover .tag,.item.on .tag{transform:rotate(-6deg)}
.room.dark .tag{background:#000;border-color:#fff;color:#fff}
.room.dark .tag::before{background:#fff}
.room.dark .tag span{color:var(--blue-lt)}

/* 표창 회전, 숫돌 회전 등 */
.spin{transform-box:fill-box;transform-origin:center;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.item:hover .spin,.item.on .spin{transform:rotate(180deg)}
.wheel{transform-box:fill-box;transform-origin:center;animation:wheel 9s linear infinite}
.item:hover .wheel{animation-duration:1.2s}
@keyframes wheel{to{transform:rotate(360deg)}}
.route{stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset 1.6s ease}
.item:hover .route,.item.on .route{stroke-dashoffset:0}
.glint{transform:translateY(320px);animation:glint 4.5s ease-in-out infinite}
@keyframes glint{0%,60%{transform:translateY(320px)}85%,100%{transform:translateY(-60px)}}
.arrow-up{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.item:hover .a1{transform:translateY(-18px)}.item:hover .a2{transform:translateY(-30px);transition-delay:.06s}.item:hover .a3{transform:translateY(-12px);transition-delay:.12s}
.bul{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.item:hover .bul{transform:translateY(-10px)}
.spear{transform-box:fill-box;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.3,1.4,.4,1)}
.item:hover .s1{transform:rotate(-3deg)}.item:hover .s3{transform:rotate(3deg)}
.bell{transform-box:fill-box;transform-origin:50% 0%}
.item:hover .bell{animation:ring .8s ease}
@keyframes ring{20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}

/* 앞쪽 기둥 */
.pillar{position:absolute;top:0;width:28px;height:900px;background:#000}
.pillar b{position:absolute;bottom:40px;left:50%;transform:translateX(-50%) rotate(-90deg);transform-origin:center;white-space:nowrap;color:#fff;font-weight:700;font-size:12px;letter-spacing:.3em}

/* 천장 조명 */
.lamp{position:absolute;top:64px;width:2px;background:var(--ink)}
.lamp::after{content:"";position:absolute;bottom:-14px;left:-22px;width:46px;height:14px;background:var(--ink);border-radius:23px 23px 0 0}
.room.dark .lamp{background:#3a3a3c}.room.dark .lamp::after{background:#fff}
.beam{position:absolute;top:0;width:0;height:0;border-left:150px solid transparent;border-right:150px solid transparent;opacity:.08;pointer-events:none}

/* 입구 문 */
.doors{position:fixed;inset:0;z-index:60;display:flex;pointer-events:none}
.door{flex:1;background:#000;transition:transform 1.4s cubic-bezier(.7,0,.2,1);display:flex;align-items:center}
.door.l{justify-content:flex-end;border-right:1px solid #222}
.door.r{justify-content:flex-start}
.door span{color:#fff;font-weight:800;font-size:44px;letter-spacing:-.02em;padding:0 28px}
.door.r span{color:var(--blue-lt)}
.doors.open .l{transform:translateX(-101%)}
.doors.open .r{transform:translateX(101%)}
.handle{width:6px;height:120px;background:#fff;border-radius:3px;margin:0 18px}

/* 바닥 평면도 길잡이 */
.plan{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:2px;padding:6px;border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.plan button{padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink-2);white-space:nowrap;transition:background .3s,color .3s}
.plan button.on{background:var(--ink);color:#fff}
.plan .bar{position:absolute;left:24px;right:24px;bottom:-10px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.plan .bar i{display:block;height:100%;width:0;background:var(--blue)}

.proto{position:fixed;left:24px;bottom:30px;z-index:39;font-weight:600;font-size:12px;color:var(--ink-3);letter-spacing:.06em}

/* 서랍 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .4s;z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;background:#fff;z-index:71;transform:translateX(100%);transition:transform .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:auto}
.open-d .scrim{opacity:1;pointer-events:auto}
.open-d .drawer{transform:none}
.d-fig{background:var(--mist);height:260px;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.d-fig svg{max-height:240px;max-width:300px}
.d-close{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;background:#fff;font-size:20px;font-weight:700}
.d-body{padding:34px 40px 40px;display:flex;flex-direction:column;gap:22px}
.d-weapon{font-weight:600;font-size:13px;letter-spacing:.16em;color:var(--blue)}
.d-name{font-weight:800;font-size:34px;line-height:1.15;letter-spacing:-.03em;margin-top:8px}
.d-one{font-weight:500;font-size:17px;line-height:1.55;color:var(--ink-2);margin-top:12px}
.d-sec h4{font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--ink-3);margin-bottom:10px}
.d-sec ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.d-sec li{font-weight:600;font-size:16px;line-height:1.45;padding-left:18px;position:relative}
.d-sec li::before{content:"";position:absolute;left:0;top:9px;width:8px;height:2px;background:var(--ink)}
.d-price{display:flex;align-items:baseline;gap:10px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.d-price b{font-weight:800;font-size:30px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.d-price span{font-weight:600;font-size:14px;color:var(--ink-3)}
.d-cta{display:flex;gap:10px}
.d-cta .pill{padding:15px 22px;font-size:15px}
.d-note{font-weight:500;font-size:12px;color:var(--ink-3)}

/* 상담 창 */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .35s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{width:560px;max-height:86vh;overflow:auto;background:#fff;border-radius:20px;padding:40px 44px;transform:translateY(24px);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.modal.on .sheet{transform:none}
.sheet h3{font-weight:800;font-size:30px;letter-spacing:-.03em}
.sheet p.lead{color:var(--ink-2);font-weight:500;font-size:16px;margin-top:8px;line-height:1.5}
.q{margin-top:22px}
.q label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
.q input{width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);font:500 15px var(--sans)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 15px;border-radius:999px;background:var(--mist);font-weight:700;font-size:14px}
.chips button.on{background:var(--ink);color:#fff}
.deposit{margin-top:26px;padding:18px 20px;border-radius:14px;background:var(--mist);font-weight:600;font-size:14px;line-height:1.55;color:var(--ink-2)}
.deposit b{color:var(--ink)}
.sheet .row{display:flex;justify-content:space-between;align-items:center;margin-top:26px}

/* 목록 보기 */
.list{position:fixed;inset:64px 0 0 0;z-index:50;background:#fff;overflow:auto;padding:56px 80px 120px;opacity:0;pointer-events:none;transition:opacity .35s}
.list.on{opacity:1;pointer-events:auto}
.list h2{font-weight:800;font-size:44px;letter-spacing:-.03em}
.list-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:36px}
.lcard{background:var(--mist);border-radius:20px;padding:24px;text-align:left;display:flex;flex-direction:column;gap:12px;transition:transform .3s}
.lcard:hover{transform:translateY(-4px)}
.lcard .lf{height:150px;display:flex;align-items:center;justify-content:center}
.lcard .lf svg{max-height:140px;max-width:170px}
.lcard small{font-weight:600;font-size:12px;letter-spacing:.14em;color:var(--blue)}
.lcard strong{font-weight:800;font-size:20px;letter-spacing:-.02em}
.lcard span{font-weight:700;font-size:14px;color:var(--ink-2)}
</style>
</head>

   <div class="d-cta"><button class="pill blue" data-consult>이 무기로 상담</button><button class="pill ghost" id="dNext">다음 진열대 · ${nx.weapon}</button></div>
   <p class="d-note">견적서 · 세금계산서는 회사 이름 '스픽스'로 발행합니다.</p>`;
  $('#dNext').onclick=()=>{closeD();setTimeout(()=>{target=roomCenter(nx.room);clamp();setTimeout(()=>openItem(nx.id),900)},300)};
  target=it.x+130-(viewW-480/scale)/2;clamp();wrap.classList.add('open-d');locked=true;
}
function closeD(){wrap.classList.remove('open-d');locked=false;document.querySelectorAll('.item').forEach(b=>b.classList.remove('on'))}
$('#scrim').onclick=closeD;
document.addEventListener('click',e=>{
  const it=e.target.closest('.item');if(it&&!drag){const d=ITEMS.find(i=>i.id===it.dataset.id);if(d.consult){openModal();return}openItem(it.dataset.id);return}
  if(e.target.closest('[data-consult]')){openModal()}
});
addEventListener('keydown',e=>{if(e.key==='Escape'){closeD();closeModal();$('#list').classList.remove('on')}});

/* 상담 창 */
function openModal(){closeD();$('#modal').classList.add('on');locked=true}
function closeModal(){$('#modal').classList.remove('on');locked=false}
$('#mClose').onclick=closeModal;
$('#mSend').onclick=()=>{$('#mSend').textContent='접수됐습니다 (시제품)';setTimeout(()=>{closeModal();$('#mSend').textContent='신청하기'},1300)};
document.querySelectorAll('.chips').forEach(c=>c.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;c.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}));

/* 진열 목록 */
$('#listGrid').innerHTML=ITEMS.filter(i=>!i.consult).map(it=>`<button class="lcard" data-l="${it.id}"><div class="lf">${svg[it.art](it.dark?'#1d1d1f':undefined,it.dark?'#fff':undefined)}</div><small>${it.weapon}</small><strong>${it.name}</strong><span>${it.price}</span></button>`).join('');
$('#btnList').onclick=()=>{const l=$('#list');l.classList.toggle('on');$('#btnList').textContent=l.classList.contains('on')?'대장간으로':'진열 목록'};
$('#listGrid').addEventListener('click',e=>{const c=e.target.closest('.lcard');if(!c)return;$('#list').classList.remove('on');$('#btnList').textContent='진열 목록';const it=ITEMS.find(i=>i.id===c.dataset.l);if(it.consult){openModal();return}goRoom(it.room);setTimeout(()=>openItem(it.id),700)});

/* 입장: 문이 열린다 */
setTimeout(()=>$('#doors').classList.add('open'),700);
/* 녹화용 자동 둘러보기: 주소 끝에 #tour */
if(location.hash==='#tour'){
  const steps=[[2600,()=>target=900],[1600,()=>goRoom('z1')],[1300,()=>document.querySelector('[data-id=card]').classList.add('on')],[1400,()=>{document.querySelector('[data-id=card]').classList.remove('on');goRoom('z2')}],[1600,()=>openItem('package')],[3600,()=>closeD()],[900,()=>goRoom('z3')],[1500,()=>document.querySelector('[data-id=custom]').classList.add('on')],[1200,()=>{document.querySelector('[data-id=custom]').classList.remove('on');goRoom('z4')}],[1400,()=>document.querySelector('[data-id=warmap]').classList.add('on')],[2000,()=>{document.querySelector('[data-id=warmap]').classList.remove('on');goRoom('z5')}],[2200,()=>goRoom('z6')],[1600,()=>openModal()],[600,()=>document.querySelectorAll('.chips')[2].children[3].classList.add('on')],[700,()=>document.querySelectorAll('.chips')[3].children[0].classList.add('on')],[2600,()=>closeModal()],[400,()=>{}]];
  let t=0;steps.forEach(([d,f])=>{t+=d;setTimeout(f,t)});
}
</script>
</body>
</html>
